name: Build and Delivery

on:
  push:
    branches: [master]

jobs:
  cd:
    runs-on: ubuntu-latest
    # Создаем универсальную переменную: если нет в секретах, берем из переменных
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
    
    steps:
      - name: Diagnostic - Check User
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "ERROR: DOCKER_USER is still EMPTY. Check GitHub Settings -> Secrets and Variables!"
            exit 1
          else
            echo "SUCCESS: DOCKER_USER is found."
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.DOCKER_USER }}/my-app:latest
